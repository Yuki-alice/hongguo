# 测试标签配置。
#
# ## 四个 tag 各自的意义
#
# | tag | 默认是否跑 | 是什么 |
# | --- | --- | --- |
# | `engine` | 否（CI 单独 job 显式跑） | 只标记**真正会向线上站点发请求**的用例（`engine_live_test.dart`、`engine_capabilities_live_test.dart`）。断网、站点改版或限流都会让它们失败，那不是代码回归，因此不能放进必过路径 |
# | `capture` | 否 | 只出图、不做断言的截图用例。依赖宿主系统字体，且 `skip: !CAPTURE_SCREENS`，所以 `--run-skipped` 也绝不能把它们拉进来 |
# | `slow` | **否**（`skip: true`） | 重集成套件：播放器、电视遥控、下载流程、媒体库/合并、本地持久化、随包插件。单个套件 10–30 秒，且都不在桌面视觉改造面上 |
# | `env` | 否 | 依赖构建期开关（`--dart-define=ALL_SOURCES`）或宿主机工具（ffmpeg）的用例。它们的 `skip:` 是代码里算出来的，`--run-skipped` 会强行跑并误报失败，所以必须靠 tag 排除 |
#
# 其余引擎用例（bridge / cache / capabilities / resolve / download …）全部是
# 离线夹具驱动，已回归默认套件——引擎动态库由 native-assets 构建钩子
# （hook/build.dart）在测试启动时自动编译提供。
#
# ## 日常怎么用
#
# ```sh
# flutter test                                   # 默认套件：快，跳过 slow / engine / capture
# flutter test test/ui/interface_test.dart       # 只跑一个文件（改卡片时最常用）
# flutter test --tags slow --run-skipped         # 只跑被默认跳过的那批重套件
# flutter test --run-skipped \
#   --exclude-tags "engine||capture||env"        # 全量（CI 用的就是这条）
# flutter test test/ui/shell/capture_screens_test.dart --tags capture \
#   --dart-define=CAPTURE_SCREENS=true --update-goldens   # 生成截图
# ```
#
# `--tags` / `--exclude-tags` 接的是布尔选择器，或运算是 `||`（写成 `|` 会报
# `expected "||"`）。
#
# `slow` 的跳过写在下面的 `tags:` 里，因此**任何** `flutter test` 默认都会跳过它，
# 包括 CI——CI 必须带 `--run-skipped`，否则覆盖率会静默掉下来。
# `--tags slow` 只改变「选中哪些用例」，不改变「选中的用例是否被 skip」，
# 所以想跑 slow 必须同时给 `--run-skipped`。
tags:
  engine:
  capture:
  env:
  slow:
    skip: true
