[toolchain]
# native_toolchain_rust 要求钉住具体版本保证构建可复现（不要用浮动的 stable）。
# 1.99.1 为当前已知可完整构建本 workspace 的版本。
channel = "1.99.1"
targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "x86_64-pc-windows-msvc",
]
