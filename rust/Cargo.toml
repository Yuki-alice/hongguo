[workspace]
resolver = "2"
members = ["bridge", "crates/*"]

[workspace.package]
edition = "2021"
version = "0.3.0"
rust-version = "1.97"

[workspace.dependencies]
aes = "0.8"
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["pkcs8", "rand_core"] }
async-trait = "0.1"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
cssparser = "0.38.0"
hex = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
# 正则型站源用；scraper 已间接引入同名版本，直接依赖不额外增加包体。
regex = "1"
rquickjs = { version = "0.9", features = ["bindgen", "loader"] }
scraper = "0.27.0"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
# 插件包只接受 deflate：bzip2 / zstd / lzma 会拖进三端都要交叉编译的 C 依赖。
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# 必须保持 unwind：flutter_rust_bridge 依赖 catch_unwind 把 Rust panic 转成 Dart 异常。
# abort 模式下任何一处 expect 都会直接终止 Flutter 进程，且无法上报。
panic = "unwind"
# 发布产物不需要调试符号：strip 后引擎动态库体积显著下降。
debug = false
strip = "debuginfo"

[profile.dev]
# 默认的 `debug = 2` 会在 Windows 上为每个编译单元生成几百 MB 的 .pdb，
# 且每次改代码产生新哈希就多一份——实测积累到 28 GB / 436 个文件。
# `line-tables-only` 保留行号（backtrace 仍有文件名与行号），丢掉变量与类型
# 信息，体积降一个数量级。需要完整调试信息时临时加 `--config profile.dev.debug=2`。
debug = "line-tables-only"
# 增量编译对本仓库收益有限（单次全量约 3-5 分钟），但会在 target/debug 下
# 留下大量中间产物。关闭后 target 增长主要只来自 deps。
incremental = false

[profile.test]
# 测试进程同样不需要完整符号；用例失败时的 panic 位置靠行号表就够。
debug = "line-tables-only"

