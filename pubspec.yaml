name: hoshi
description: 独立运行的多端视频应用（短剧 / 动漫 / 电影 / 剧集），Rust 引擎 + 插件化站源
publish_to: none
version: 0.2.62+68

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 生成的 l10n 代码直接 `import 'package:intl/intl.dart'`，显式声明避免依赖
  # 「flutter_localizations 恰好带进来」这种隐式解析。
  intl: any
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  # 桌面 / iOS 的版本号从平台读取，避免把 pubspec 的 version 抄成 Dart 常量。
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.5
  flutter_foreground_task: 11.0.3
  ffmpeg_kit_flutter_new_min_gpl: 2.6.2
  file_picker: 13.1.0
  crypto: ^3.0.7
  window_manager: ^0.5.1
  # 桌面托盘：关闭窗口时最小化到托盘（P4）。
  tray_manager: ^0.5.0
  # 系统取色（Android 12+ / macOS 14+），主题个性化（P5）。
  dynamic_color: ^1.9.0
  nsd: 5.0.1

  flutter_rust_bridge: 2.13.0
  # native-assets 构建钩子：hook/build.dart 在 flutter build / flutter test 时
  # 自动用 Cargo 构建并打包 Rust 动态库，取代原 rust_builder（cargokit）插件包。
  flutter_rust_bridge_hooks: 2.13.0

  # 状态管理：Notifier / AsyncNotifier + 依赖注入，替代手写 setState。
  flutter_riverpod: 3.4.3
  # M3 Expressive 形状几何：空态徽标与加载器共用一套 shape 定义。
  material_new_shapes: ^1.0.0

  # 声明式路由：类型安全参数与深链。刻意停在 17.x：
  # 18.x 起依赖 material_ui / cupertino_ui 拆分包，与当前 SDK 的
  # MaterialApp 不是同一个类，会让 Hero 与页面构造静默降级。
  go_router: 17.5.0
dev_dependencies:
  # 保留 SDK 测试依赖：前端套件已移除，但偶尔仍需写一次性冒烟用例
  # 验证某个交互，不必每次都改 pubspec。
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video

flutter:
  # l10n 代码由 `flutter gen-l10n` 生成到 lib/l10n/generated/，
  # 必须显式开启 generate，否则该命令会拒绝执行。
  generate: true
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  fonts:
    # 内置中文字体。只有 Regular 一个字重，w500 以上由 Flutter 合成——
    # 这与参照应用的做法一致，额外引入 Bold 会让字重梯度对不上。
    # 约 7.75MB，是包体里最大的一项非代码资产。
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
  assets:
    - assets/images/logo/
    - assets/video_enhancement/
    # 官方插件预装包：首次启动安装到插件仓库（Core-3）。
    - assets/bundled_plugins/
