name: duanju_app
description: 独立运行的多端短剧应用
publish_to: none
version: 0.2.62+68

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 生成的 l10n 代码直接 `import 'package:intl/intl.dart'`，显式声明避免依赖
  # 「flutter_localizations 恰好带进来」这种隐式解析。
  intl: any
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_foreground_task: 11.0.3
  ffmpeg_kit_flutter_new_min_gpl: 2.6.2
  file_picker: 13.1.0
  crypto: ^3.0.7
  window_manager: ^0.5.1
  nsd: 5.0.1

  flutter_rust_bridge: 2.13.0
  # native-assets 构建钩子：hook/build.dart 在 flutter build / flutter test 时
  # 自动用 Cargo 构建并打包 Rust 动态库，取代原 rust_builder（cargokit）插件包。
  flutter_rust_bridge_hooks: 2.13.0

  # 状态管理：Notifier / AsyncNotifier + 依赖注入，替代手写 setState。
  flutter_riverpod: 3.4.3
  # 声明式路由：类型安全参数与深链。刻意停在 17.x：
  # 18.x 起依赖 material_ui / cupertino_ui 拆分包，与当前 SDK 的
  # MaterialApp 不是同一个类，会让 Hero 与页面构造静默降级。
  go_router: 17.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video

flutter:
  # l10n 代码由 `flutter gen-l10n` 生成到 lib/l10n/generated/，
  # 必须显式开启 generate，否则该命令会拒绝执行。
  generate: true
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/video_enhancement/
