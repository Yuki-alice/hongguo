[package]
name = "guo_engine"
description = "真果鉴本地引擎（Flutter 桥接层）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[dependencies]
guo-host = { path = "../crates/host" }
guo-media = { path = "../crates/media" }
guo-plugin-host = { path = "../crates/plugin-host" }
# 体积决策 A（2026-10-20 已定）：三端全量引入 wasmtime，不为体积做平台分层。
guo-plugin-wasm = { path = "../crates/plugin-wasm" }
guo-rule-engine = { path = "../crates/rule-engine" }
guo-runtime = { path = "../crates/runtime" }
guo-source-api = { path = "../crates/source-api" }
guo-source-hongguo = { path = "../crates/source-hongguo" }
guo-source-maoguo = { path = "../crates/source-maoguo" }
guo-source-niuguo = { path = "../crates/source-niuguo" }
async-trait.workspace = true
flutter_rust_bridge = "=2.13.0"
semver.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio.workspace = true
