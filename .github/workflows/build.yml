name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 全仓统一的 Flutter / Dart 版本。dart format 的输出与 SDK 版本绑定，
  # 本地与 CI 不一致会造成「本地已格式化、CI 仍报格式漂移」的假失败。
  FLUTTER_VERSION: '3.47.7'
  # 引擎动态库由 native-assets 钩子（hook/build.dart）构建，供 cargo 使用的
  # 工具链由 rust/rust-toolchain.toml 钉住，无需在这里 setup-go。
  #
  # 单版本构建：应用名固定为「星」，不再区分红果鉴 / 真果鉴。
  # ALL_SOURCES 只决定**编译进哪些站源**：iOS 全源，其余平台只带内置站源。

jobs:
  # ───────────────────────────── 静态检查与单测 ─────────────────────────────
  rust:
    # Rust 引擎的静态检查与测试。纯 Linux 即可，不需要 Flutter 或 NDK：
    # 插件宿主在 Linux 上同样使用 Pulley 解释器，与三端行为一致。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust 工具链（版本与组件由 rust-toolchain.toml 决定）
        # 不用 dtolnay/rust-toolchain 的 stable：本仓库钉了 1.99.1，且
        # rustfmt / clippy 组件必须按 toolchain 文件安装，否则报
        # `'cargo-fmt' is not installed for the toolchain`。
        run: |
          rustup show
          rustup component add rustfmt clippy
        working-directory: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Format
        run: cargo fmt --all --check
        working-directory: rust
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - name: 生成官方规则仓库（端到端测试需要）
        run: cargo run -p guo-plugin-host --bin pack_rules -- dist/rules rules
        working-directory: rust
      - name: Test
        run: cargo test --workspace
        working-directory: rust
      - name: 依赖方向守卫
        run: |
          # 契约层不得引入运行时依赖（ARCHITECTURE.md §6.3）。
          if cargo tree -p guo-source-api -e normal 2>/dev/null \
              | grep -Eq '\b(tokio|reqwest|wasmtime|rquickjs)\b'; then
            echo "::error::guo-source-api 引入了运行时依赖"
            exit 1
          fi

  flutter:
    # Dart 侧静态检查 + 全量单测（含离线引擎用例）+ 在线用例（非阻断）。
    #
    # 引擎动态库由 native-assets 构建钩子（hook/build.dart）在 `flutter test`
    # 启动时自动编译注入，无需手工准备产物。
    runs-on: ubuntu-latest
    # job 级超时只是兜底：每个可能挂住的步骤都有自己的 timeout，
    # 否则一次 apt 卡顿就会吃掉整个 job 的时间预算。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - name: Format
        # --set-exit-if-changed 是必需的：不带它 dart format 会就地改写文件并
        # 返回 0，格式漂移会被静默吞掉。
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: |
          # info 级提示不拦合并，但 error / warning 必须为零。
          dart analyze lib test | tee analyze.log
          if grep -Eq '^\s*(error|warning)\s+-' analyze.log; then
            echo "::error::dart analyze 存在 error / warning"
            exit 1
          fi
      - name: ffmpeg
        # 镜像通常自带；没有才装。apt-get update 在网络抖动时会长时间挂住，
        # 曾把整个 job 拖到 30 分钟超时（测试一步没跑），所以这里既有快速
        # 路径，也有硬超时兜底。
        timeout-minutes: 5
        run: |
          if command -v ffmpeg > /dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test
        # `engine` tag 只标记 2 个真实在线用例；其余引擎用例是离线夹具驱动。
        # --coverage 收集行覆盖，产物可接 codecov。
        timeout-minutes: 20
        run: flutter test --exclude-tags engine --dart-define=DISABLE_REMOTE_IMAGES=true --coverage
      - name: 覆盖率产物
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Test (在线站源)
        # 站点不可达、改版或限流都会失败——提供信号，但不拦合并。
        continue-on-error: true
        timeout-minutes: 10
        run: flutter test --tags engine --dart-define=DISABLE_REMOTE_IMAGES=true

  # ───────────────────────────── 四端构建 ─────────────────────────────
  # 全部直连 flutter build CLI——引擎动态库由 native-assets 钩子交叉编译，
  # 与纯 Flutter 项目的 CI 形态一致。单版本，每端一个 job。
  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install MinGW
        # media_kit 的 libmpv 链接需要 MinGW 提供的一组导入库。
        run: |
          choco install mingw --version=13.2.0 -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\ProgramData\mingw64\mingw64\bin"
          $lib = "C:\ProgramData\mingw64\mingw64\x86_64-w64-mingw32\lib"
          if (Test-Path $lib) {
            Remove-Item (Join-Path $lib 'libpthread.dll.a') -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $lib 'libwinpthread.dll.a') -ErrorAction SilentlyContinue
          }
      - run: flutter pub get --enforce-lockfile
      - name: Build
        run: flutter build windows --release --no-pub --dart-define=ALL_SOURCES=false
      - run: choco install ffmpeg --no-progress -y
      - name: Smoke
        # 直接运行构建产物，验收随包原生核心与媒体链路；失败只作信号。
        run: python scripts/smoke_windows.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: hoshi-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: CocoaPods
        run: |
          flutter config --enable-macos-desktop
          sudo xcode-select -s /Applications/Xcode.app
      - run: flutter pub get --enforce-lockfile
      - name: Build
        run: flutter build macos --release --no-pub --dart-define=ALL_SOURCES=false
      - uses: actions/upload-artifact@v4
        with:
          name: hoshi-macos
          path: build/macos/Build/Products/Release/hoshi.app
          if-no-files-found: error
          retention-days: 14

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # 必须有：后面的 `flutter build ... --no-pub` 不会自己解析依赖，
      # 缺 .dart_tool/package_config.json 会让 gradle 的 build_hooks 直接失败。
      - run: flutter pub get --enforce-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: NDK
        # 版本必须与 android/app/build.gradle.kts 的 ndkVersion 一致：
        # 钩子交叉编译时从我方 SDK 目录取 clang，gradle 也按同一版本找。
        # sdkmanager 的 NDK 包约 1GB，下载偶发中断（Error on ZipFile
        # unknown archive），因此带重试。
        run: |
          NDK_VERSION=28.2.13676358
          SDKM_BIN=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path '*/bin/*' | head -1)")
          echo "$SDKM_BIN" >> "$GITHUB_PATH"
          yes | "$SDKM_BIN/sdkmanager" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then break; fi
            if "$SDKM_BIN/sdkmanager" "ndk;$NDK_VERSION"; then break; fi
            echo "NDK 安装失败，第 $attempt 次重试"
            sleep 15
          done
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Configure Android signing
        # 官方机制：gradle 的 signingConfigs 读 android/key.properties；
        # 未配置 secrets 时跳过，gradle 自动回退 debug 签名，仍可安装。
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置签名 secrets，使用 debug 签名。"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Build
        run: flutter build apk --release --split-per-abi --no-pub --dart-define=ALL_SOURCES=false
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: hoshi-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: ios
    # iOS 是唯一全源编译的端；仅产未签名包（.ipa 走 convert-ios-ipa 工作流）。
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: CocoaPods
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          pod --version
      - run: flutter pub get --enforce-lockfile
      - name: 诊断：iOS 目标直接 cargo build
        # 钩子在 Xcode 的 Run Script 阶段跑，Xcode 只保留 rustc 的第一行错误，
        # 真正的 ld 报错会被吞掉。这里用同样的链接器环境单独构建一次，
        # 把完整 stderr 打到日志里（诊断通过后删除）。
        run: |
          cd rust
          export CARGO_TARGET_AARCH64_APPLE_IOS_LINKER="$(xcrun --sdk iphoneos --find clang)"
          export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-Clink-arg=-isysroot -Clink-arg=$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "linker: $CARGO_TARGET_AARCH64_APPLE_IOS_LINKER"
          echo "sdk: $(xcrun --sdk iphoneos --show-sdk-path)"
          "$CARGO_TARGET_AARCH64_APPLE_IOS_LINKER" --version | head -1
          cargo build --release -p guo_engine --target aarch64-apple-ios 2>&1 | tail -60
      - name: Build
        run: flutter build ios --release --no-codesign --no-pub --dart-define=ALL_SOURCES=true
      - name: Package unsigned app
        run: |
          mkdir -p build/ios-artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/ios-artifacts/hoshi-ios-unsigned-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hoshi-ios-unsigned
          path: build/ios-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
