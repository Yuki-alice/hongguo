name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 全仓统一的 Flutter / Dart 版本。dart format 的输出与 SDK 版本绑定，
  # 本地与 CI 不一致会造成「本地已格式化、CI 仍报格式漂移」的假失败。
  FLUTTER_VERSION: '3.47.7'
  # 引擎动态库由 native-assets 钩子（hook/build.dart）构建，供 cargo 使用的
  # 工具链由 rust/rust-toolchain.toml 钉住，无需在这里 setup-go。

jobs:
  # ───────────────────────────── 静态检查与单测 ─────────────────────────────
  rust:
    # Rust 引擎的静态检查与测试。纯 Linux 即可，不需要 Flutter 或 NDK：
    # 插件宿主在 Linux 上同样使用 Pulley 解释器，与三端行为一致。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust 工具链（版本与组件由 rust-toolchain.toml 决定）
        # 不用 dtolnay/rust-toolchain 的 stable：本仓库钉了 1.99.1，且
        # rustfmt / clippy 组件必须按 toolchain 文件安装，否则报
        # `'cargo-fmt' is not installed for the toolchain`。
        run: |
          rustup show
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Format
        run: cargo fmt --all --check
        working-directory: rust
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - name: 生成官方规则仓库（端到端测试需要）
        run: cargo run -p guo-plugin-host --bin pack_rules -- dist/rules rules
        working-directory: rust
      - name: Test
        run: cargo test --workspace
        working-directory: rust
      - name: 依赖方向守卫
        run: |
          # 契约层不得引入运行时依赖（ARCHITECTURE.md §6.3）。
          if cargo tree -p guo-source-api -e normal 2>/dev/null \
              | grep -Eq '\b(tokio|reqwest|wasmtime|rquickjs)\b'; then
            echo "::error::guo-source-api 引入了运行时依赖"
            exit 1
          fi

  flutter:
    # Dart 侧的静态检查与单元测试。
    #
    # 引擎测试（test/engine_*.dart）依赖 `guo_engine` 动态库，由 native-assets
    # 构建钩子（hook/build.dart）在 `flutter test` 启动时自动编译注入，无需手工
    # 准备产物；rust-toolchain.toml 钉住工具链与目标平台，缺失时 rustup 自动补齐。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - run: flutter pub get --enforce-lockfile
      - name: Format
        # --set-exit-if-changed 是必需的：不带它 dart format 会就地改写文件并
        # 返回 0，格式漂移会被静默吞掉。
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Analyze
        run: |
          # info 级提示不拦合并，但 error / warning 必须为零。
          dart analyze lib test integration_test test_driver | tee analyze.log
          if grep -Eq '^\s*(error|warning)\s+-' analyze.log; then
            echo "::error::dart analyze 存在 error / warning"
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test
        # 排除 `engine` tag：那批用例请求真实站源，断网或站点改版都会失败，
        # 不属于代码回归。在线用例由 `engine-online` job 单独跑且不阻断。
        run: flutter test --exclude-tags engine --dart-define=DISABLE_REMOTE_IMAGES=true
      - name: Test (全部站源)
        run: flutter test --exclude-tags engine --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true

  engine-online:
    # 真实站点验证。站点不可达、改版或限流都会让这里失败，因此
    # `continue-on-error`——它提供信号，但不拦合并。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - run: flutter pub get --enforce-lockfile
      - name: Test (在线站源)
        run: flutter test --tags engine --dart-define=DISABLE_REMOTE_IMAGES=true

  scripts:
    # 构建脚本自身的单元测试（scripts/test_*.py）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # ───────────────────────────── 四端构建 ─────────────────────────────
  # 矩阵的两个版本：红果鉴（默认）与真果鉴（--all-sources）。
  # 构建脚本统一走 flutter build，引擎动态库由 native-assets 钩子交叉编译。
  windows:
    name: windows (${{ matrix.edition }})
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Install MinGW
        # media_kit 的 libmpv 链接需要 MinGW 提供的一组导入库。
        run: |
          choco install mingw --version=13.2.0 -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\ProgramData\mingw64\mingw64\bin"
          $lib = "C:\ProgramData\mingw64\mingw64\x86_64-w64-mingw32\lib"
          if (Test-Path $lib) {
            Remove-Item (Join-Path $lib 'libpthread.dll.a') -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $lib 'libwinpthread.dll.a') -ErrorAction SilentlyContinue
          }
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - run: choco install ffmpeg --no-progress -y
      - name: Windows package smoke
        # 冒烟检查依赖 ffmpeg 生成的测试媒体；失败只作信号，不拦产物上传。
        run: python scripts/smoke_windows.py ${{ matrix.arguments }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos (${{ matrix.edition }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: CocoaPods
        run: |
          flutter config --enable-macos-desktop
          sudo xcode-select -s /Applications/Xcode.app
      - run: python scripts/build_macos.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-macos
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: android (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: NDK
        run: |
          SDKM_BIN=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path '*/bin/*' | head -1)")
          echo "$SDKM_BIN" >> "$GITHUB_PATH"
          yes | "$SDKM_BIN/sdkmanager" --licenses > /dev/null || true
          "$SDKM_BIN/sdkmanager" 'ndk;28.2.13676358'
      - name: Configure Android signing
        # 未配置 secrets 时脚本保持 debug 签名，构建仍可产出可安装包。
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: ios (${{ matrix.edition }})
    # iOS 仅产未签名包（.ipa 走单独的 convert-ios-ipa 工作流）。
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: CocoaPods
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          pod --version
      - run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
